name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: extractions/setup-just@v4

      - name: Install deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: beep ffmpeg zip libopus0 libvorbis0a libvorbisenc2 libmp3lame0
          version: 1.0

      - name: Build
        run: just precheck build

      - name: Upload to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} piezo_sounds.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
